<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burmalda VPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Background glow effects */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(0, 120, 255, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -10%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(ellipse, rgba(0, 80, 200, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Banner */
    .banner-wrapper {
      width: 100%;
      margin-top: 24px;
      margin-bottom: 48px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 120, 255, 0.25), 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 140, 255, 0.2);
    }

    .banner-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Main connect button */
    .connect-section {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 64px;
    }

    .btn-glass {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 40px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 0 0 1px rgba(0, 140, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .btn-glass::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.1),
        transparent
      );
      transition: left 0.5s ease;
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(0, 160, 255, 0.4);
      box-shadow:
        0 12px 40px rgba(0, 100, 255, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        0 0 20px rgba(0, 140, 255, 0.2);
      transform: translateY(-2px);
    }

    .btn-glass:hover::before {
      left: 100%;
    }

    .btn-glass:active {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-connect {
      font-size: 1.25rem;
      padding: 20px 48px;
      background: rgba(0, 120, 255, 0.15);
      border: 1px solid rgba(0, 160, 255, 0.35);
      box-shadow:
        0 8px 32px rgba(0, 80, 200, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 0 30px rgba(0, 140, 255, 0.15);
    }

    .btn-connect:hover {
      background: rgba(0, 140, 255, 0.25);
      border-color: rgba(0, 180, 255, 0.5);
      box-shadow:
        0 12px 48px rgba(0, 100, 255, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        0 0 40px rgba(0, 160, 255, 0.3);
    }

    .btn-connect svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Creators section */
    .creators-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: auto;
      padding-top: 20px;
    }

    .creators-title {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 4px;
    }

    .creators-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .btn-creator {
      min-width: 180px;
      padding: 14px 28px;
      font-size: 0.95rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-creator:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-creator .username {
      color: rgba(0, 180, 255, 0.9);
      font-weight: 600;
    }

    /* Footer note */
    .footer {
      margin-top: 48px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 0 16px 32px;
      }

      .banner-wrapper {
        margin-top: 16px;
        margin-bottom: 36px;
        border-radius: 14px;
      }

      .btn-connect {
        font-size: 1.05rem;
        padding: 16px 32px;
        width: 100%;
        max-width: 320px;
      }

      .btn-creator {
        min-width: 140px;
        flex: 1;
        max-width: 200px;
      }

      .creators-buttons {
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Banner -->
    <div class="banner-wrapper">
      <img src="banner.png" alt="Burmalda VPN — Melstroy">
    </div>

    <!-- Main connect button -->
    <div class="connect-section">
      <a href="https://t.me/BurmaldaVPN_Original" class="btn-glass btn-connect" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
        Подключить Burmalda VPN
      </a>
    </div>

    <!-- Creators -->
    <div class="creators-section">
      <div class="creators-title">Создатели</div>
      <div class="creators-buttons">
        <a href="https://t.me/theyUs99" class="btn-glass btn-creator" target="_blank" rel="noopener noreferrer">
          <span class="username">@theyUs99</span>
        </a>
        <a href="https://t.me/Aivan_Zolov" class="btn-glass btn-creator" target="_blank" rel="noopener noreferrer">
          <span class="username">@Aivan_Zolov</span>
        </a>
      </div>
    </div>

    <div class="footer">
      Burmalda VPN
    </div>
  </div>
</body>
</html>
